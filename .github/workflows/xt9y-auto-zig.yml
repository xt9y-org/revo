name: Verify automatic Zig bindings

on:
  push:
    branches: [feature/zig-auto-imports]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sdl3:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build Revo
        run: |
          zig build --fetch
          zig build -Doptimize=ReleaseFast
      - name: Compile automatically bound SDL3 example
        working-directory: examples/foreign/auto-sdl3
        run: |
          make deps
          make compile REVO="$GITHUB_WORKSPACE/zig-out/bin/revo"
